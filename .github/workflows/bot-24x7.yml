name: bot-24x7

# ══════════════════════════════════════════════════════════════════════════════
#  اجرای ربات تلگرام به‌صورت ۲۴/۷ روی GitHub Actions — رایگان و بدون سقف دقیقه
#  (فقط روی ریپوی PUBLIC؛ در ریپوی خصوصی ۲۰۰۰ دقیقه در ماه = ~۳۳ ساعت است)
#
#  منطق کار:
#    • هر job حداکثر ۶ ساعت می‌تواند اجرا شود  →  timeout-minutes: 355
#    • cron هر ۵ دقیقه یک اجرای جدید را در «صف» می‌گذارد
#    • concurrency group باعث می‌شود اجرای بعدی دقیقاً پشت‌سرهم شروع شود
#    • سیگنال TERM → persist.py ذخیرهٔ پایانی می‌کند → داده‌ها نمی‌پرند
#
#  پیش‌نیازها:
#    • Secrets:  BOT_TOKEN, ADMIN_IDS, TG_API_ID, TG_API_HASH, GH_PAT
#                (اختیاری: TG_BACKUP_TEXT برای بازگردانی بکاپ تلگرامی، AI_API_KEY)
#                (و برای ربات دوم: DOR_BOT_TOKEN, DOR_ADMIN_ID, LICENSE_PRIVATE_KEY)
#    • Variables: GH_DATA_REPO=<user>/bot-data   (اختیاری — خودش می‌سازد)
#                 ENABLE_BOT2=0 یا 1   (بدون URL عمومی، بخش آیفون/DoH کار نمی‌کند)
#
#  💾 ذخیره‌سازی دائمی: چون /tmp رانر هر ~۶ ساعت پاک می‌شود، داده‌ها در یک
#     مخزن **خصوصی** گیت‌هاب (فایل data/bundle.json) نگه داشته می‌شوند.
#     فقط GH_PAT لازم است؛ مخزن خودش خودکار و خصوصی ساخته می‌شود.
#     اگر HF_TOKEN هم باشد، اولویت با گیت‌هاب است.
# ══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "*/5 * * * *"        # صف‌سازی جانشین برای job در حال اجرا
  workflow_dispatch:             # اجرای دستی از تب Actions
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: telegram-bot            # فقط یک اجرای فعال؛ اجرای بعدی در صف می‌ماند
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest       # ۴ vCPU / ۱۶GB RAM / ۱۴GB SSD + ffmpeg نصب‌شده
    timeout-minutes: 355         # زیر سقف سخت ۶ ساعت
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-gha.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gha.txt

      - name: Check environment
        timeout-minutes: 8
        run: |
          # ffmpeg/ffprobe لازم است (فشرده‌سازی، استخراج صدا، ادغام).
          # ترتیب: اگر روی رانر بود که هیچ → نسخهٔ static (≈۵ ثانیه) → apt (کندتر).
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "⬇️ ffmpeg/ffprobe پیدا نشد — نصب سریع نسخهٔ static…"
            ok=0
            cd /tmp
            if timeout 150 curl -fsSL --retry 2 -o ff.tar.xz \
                 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz; then
              tar -xf ff.tar.xz 2>/dev/null || true
              d=$(ls -d /tmp/ffmpeg-*-amd64-static 2>/dev/null | head -1)
              if [ -n "$d" ] && [ -x "$d/ffmpeg" ]; then
                if sudo -n install -m 755 "$d/ffmpeg" "$d/ffprobe" /usr/local/bin/ 2>/dev/null; then
                  ok=1
                else
                  mkdir -p "$HOME/.local/bin"
                  install -m 755 "$d/ffmpeg" "$d/ffprobe" "$HOME/.local/bin/" && \
                    echo "$HOME/.local/bin" >> "$GITHUB_PATH" && ok=1
                fi
                [ "$ok" = "1" ] && echo "✅ static ffmpeg نصب شد"
              fi
            fi
            if [ "$ok" != "1" ]; then
              echo "⚠️ static نصب نشد — تلاش با apt (۱ تا ۲ دقیقه)…"
              sudo apt-get update -qq || true
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg || true
            fi
          fi
          echo "ffmpeg:  $(command -v ffmpeg || echo MISSING)"
          echo "ffprobe: $(command -v ffprobe || echo MISSING)"
          (ffmpeg -hide_banner -version 2>/dev/null | head -1) || true
          python -c "import telethon, yt_dlp; print('telethon', telethon.__version__, '| yt-dlp', yt_dlp.version.__version__)" \
            || echo "⚠️ یکی از پکیج‌ها نیست — مرحلهٔ Install dependencies را ببین (اجرا متوقف نمی‌شود)"
          echo "دیسک آزاد: $(df -h /tmp | tail -1 | awk '{print $4}')"
          echo "✅ محیط آماده است — رفتن به مرحلهٔ بعد"

      # ── 🌱 بازگردانی از متن بکاپ تلگرامی (اختیاری، یک‌بار مصرف) ───────────────
      # اگر Secret با نام TG_BACKUP_TEXT ساخته باشی، محتوای پیام «🗂 داده‌های ربات»
      # را به فایل‌های json در /tmp تبدیل می‌کند. فایل‌هایی که از قبل موجودند
      # بازنویسی نمی‌شوند، پس نگه‌داشتنش ضرر ندارد.
      - name: Seed data from Telegram backup (optional)
        env:
          TG_BACKUP_TEXT: ${{ secrets.TG_BACKUP_TEXT }}
        run: python -u restore_from_text.py

      # ── اختیاری: تانل Cloudflare برای بخش آیفون/DoH دوربرگردون ──────────────
      # فقط اگر Named Tunnel ساخته‌اید و توکنش را در Secret با نام CF_TUNNEL_TOKEN
      # گذاشته‌اید، کامنت این step را بردارید. آنگاه PUBLIC_URL را در Variables روی
      # دامنهٔ ثابت تانل (مثل https://bot.example.com) بگذارید و ENABLE_BOT2=1 کنید.
      #
      # - name: Start Cloudflare tunnel (optional)
      #   env:
      #     CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      #   run: |
      #     if [ -z "$CF_TUNNEL_TOKEN" ]; then echo "CF_TUNNEL_TOKEN نیست — رد شد"; exit 0; fi
      #     curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
      #     chmod +x /tmp/cloudflared
      #     /tmp/cloudflared tunnel --no-autoupdate run --token "$CF_TUNNEL_TOKEN" &
      #     sleep 8
      #     echo "✅ تانل Cloudflare بالا آمد"
      # ─────────────────────────────────────────────────────────────────────────

      # ♻️ کشِ فایل‌های نیمه‌کاره: خروجیِ فشرده‌شده‌ای که آپلود نشده، اینجا می‌ماند
      #    (سقفِ کش هر مخزن ۱۰ گیگ رایگان است و بین اجراها باقی می‌ماند)
      - name: Restore job files (cache)
        uses: actions/cache@v4
        with:
          path: /tmp/jobcache
          key: jobcache-${{ github.run_id }}
          restore-keys: |
            jobcache-

      - name: Run bots
        env:
          # ── ربات ۱: آچارفرانسه ──
          BOT_TOKEN:           ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS:           ${{ secrets.ADMIN_IDS }}
          AI_API_KEY:          ${{ secrets.AI_API_KEY }}
          # 🔐 کلید رمزنگاری نشست‌های اکانت‌خوان (بدون این، /login قفل نمی‌شود)
          SESSION_KEY:         ${{ secrets.SESSION_KEY }}
          # یوزرنیم ربات برای لینک دعوت (اگر خودکار تشخیص داده نشد)
          BOT_USERNAME:        ${{ vars.BOT_USERNAME }}
          USERBOT_ENABLED:     ${{ vars.USERBOT_ENABLED || '1' }}
          AGENT_ENABLED:       ${{ vars.AGENT_ENABLED }}
          SDSEND_ENABLED:      ${{ vars.SDSEND_ENABLED || '1' }}
          # ── ربات ۲: دوربرگردون ──
          DOR_BOT_TOKEN:       ${{ secrets.DOR_BOT_TOKEN }}
          DOR_ADMIN_ID:        ${{ secrets.DOR_ADMIN_ID }}
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
          PUBLIC_URL:          ${{ vars.PUBLIC_URL }}
          IOS_PUBLIC_URL:      ${{ vars.IOS_PUBLIC_URL }}
          MODE:                ${{ vars.MODE }}
          TELEGRAM_API_BASE:   ${{ vars.TELEGRAM_API_BASE }}
          # ── مشترک ──
          TG_API_ID:           ${{ secrets.TG_API_ID }}
          TG_API_HASH:         ${{ secrets.TG_API_HASH }}
          # ذخیره‌سازی دائمی — پشتیبان اصلی: یک مخزن **خصوصی** گیت‌هاب (بدون نیاز به HF)
          GH_PAT:              ${{ secrets.GH_PAT }}          # توکن گیت‌هاب با دسترسی repo
          GH_DATA_REPO:        ${{ vars.GH_DATA_REPO }}       # اختیاری؛ پیش‌فرض <owner>/bot-data
          # پشتیبان جایگزین/قدیمی: Hugging Face (اگر اکانت داری)
          HF_TOKEN:            ${{ secrets.HF_TOKEN }}
          DATA_REPO:           ${{ vars.DATA_REPO }}
          DOR_DATA_REPO:       ${{ vars.DOR_DATA_REPO }}
          # ── رفتار ──
          # بکاپ تلگرامی: new = پیام تازه (پیش‌فرض) | edit = ویرایش پیام قبلی
          TGSTORE_MODE:          ${{ vars.TGSTORE_MODE || 'new' }}
          TGSTORE_NEW_EVERY_MIN: ${{ vars.TGSTORE_NEW_EVERY_MIN || '15' }}
          TGSTORE_DELETE_OLD:    ${{ vars.TGSTORE_DELETE_OLD || '0' }}
          ENABLE_BOT1:         ${{ vars.ENABLE_BOT1 || '1' }}
          ENABLE_BOT2:         ${{ vars.ENABLE_BOT2 || '0' }}
          PERSIST_SECONDS:     "30"          # ذخیرهٔ داده هر ۳۰ ثانیه (ری‌استارت ۶ ساعته)
          PORT:                "7860"
          RUN_LIMIT_MIN:       "335"          # ربات بداند چه زمانی اجرا تمام می‌شود
          # 🖐 منبع روشن‌شدن: schedule = خودکار (بی‌صدا) | workflow_dispatch = دستی (اعلان)
          RUN_TRIGGER:         ${{ github.event_name }}
        run: |
          set -o pipefail
          echo "⏳ شروع اجرا در $(date -u '+%F %T UTC') — تا ~۵ ساعت و ۴۰ دقیقه"
          # TERM در دقیقهٔ ۳۴۰؛ اگر ۶۰ ثانیه بعد هنوز زنده بود KILL
          timeout --signal=TERM --kill-after=60s 340m python -u run_all.py
          echo "✅ پایان اجرا در $(date -u '+%F %T UTC') — اجرای بعدی از صف جایگزین می‌شود"

      - name: Save job files (cache)
        if: always()
        uses: actions/cache@v4
        with:
          path: /tmp/jobcache
          key: jobcache-${{ github.run_id }}
          # اگر کلیدی تکراری باشد چیزی ذخیره نمی‌شود؛ run_id یکتاست
