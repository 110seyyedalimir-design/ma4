name: bot-watchdog

# ══════════════════════════════════════════════════════════════════════════════
#  سگ‌نگهبان: هر ساعت چک می‌کند که workflow اصلی (bot-24x7) در حال اجرا یا در صف
#  باشد؛ اگر نبود (مثلاً اجرای زمان‌بندی‌شده توسط گیت‌هاب skip شده باشد) دستی
#  راه‌اندازی‌اش می‌کند. این فایل اختیاری است ولی «آپ‌تایم» را خیلی بهتر می‌کند.
# ══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "23 * * * *"          # هر ساعت، دقیقهٔ ۲۳
  workflow_dispatch:

permissions:
  contents: read
  actions: write                  # برای createWorkflowDispatch لازم است

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure bot-24x7 is running
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const wf = 'bot-24x7.yml';

            let active = 0;
            for (const status of ['in_progress', 'queued', 'requested', 'pending']) {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: wf, status, per_page: 5,
                });
                active += data.total_count;
                core.info(`${status}: ${data.total_count}`);
              } catch (e) {
                core.info(`${status}: خطا (${e.message})`);
              }
            }

            if (active > 0) {
              core.info(`✅ ربات فعال است (${active} اجرا) — کاری لازم نیست`);
              return;
            }

            const { data: r } = await github.rest.repos.get({ owner, repo });
            const ref = r.default_branch || 'main';
            core.warning(`⛔ هیچ اجرای فعالی نیست — راه‌اندازی مجدد روی شاخهٔ ${ref}`);
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: wf, ref });
            core.info('✅ دستور اجرا صادر شد');
